name: Daily TNPSC Reminder

on:
  schedule:
    # இந்திய நேரப்படி (IST) தினமும் காலை 7:00 மணி (UTC 01:30)
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  trigger-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Telegram Serverless Endpoint
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          npm install -g @tgcloud/cli
          mkdir bot && cd bot
          tgcloud init
          tgcloud fetch
          tgcloud reset
          tgcloud pull
          tgcloud run endpoints/dailyReminder '{}'
