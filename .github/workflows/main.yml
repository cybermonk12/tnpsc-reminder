name: Daily TNPSC Reminder

on:
  push:
    branches: [ main ]
  schedule:
    # 01:30 UTC + 05:30 = சரியாக காலை 7:00 மணி (Indian Standard Time)
    - cron: '30 1 * * *'
  workflow_dispatch:

env:
  TZ: 'Asia/Kolkata' # இந்திய நேரம் (+5:30 IST)

jobs:
  trigger-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check Indian Time (+5:30)
        run: |
          echo "தற்போதைய இந்திய நேரம் (IST): $(date)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Telegram Serverless Endpoint
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          npm install -g @tgcloud/cli
          mkdir bot && cd bot
          tgcloud init
          tgcloud fetch
          tgcloud reset
          tgcloud pull
          tgcloud run endpoints/dailyReminder '{}'
